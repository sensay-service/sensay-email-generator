<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sensay Email Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px 60px;
    }

    .header {
      margin-bottom: 28px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .header p {
      margin: 0;
      color: #666;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: 0 3px 14px rgba(0,0,0,0.06);
    }

    .card h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 14px;
      font-weight: 600;
    }

    input,
    select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d5d9e2;
      border-radius: 8px;
      font-size: 15px;
      background: white;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #555;
    }

    .hint {
      font-size: 12px;
      color: #777;
    }

    .hidden {
      display: none !important;
    }

    .generate-btn {
      margin-top: 24px;
      width: 100%;
      border: none;
      border-radius: 9px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: #111;
      color: white;
    }

    .generate-btn:hover {
      opacity: 0.88;
    }

    .result-section {
      display: none;
    }

    .result-section.show {
      display: block;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 10px;
    }

    .result-header h3 {
      margin: 0;
      font-size: 15px;
    }

    .copy-btn {
      border: 1px solid #ccc;
      background: white;
      padding: 7px 12px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 13px;
    }

    .copy-btn:hover {
      background: #f3f3f3;
    }

    .subject-box {
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fafafa;
      margin-bottom: 25px;
      word-break: break-word;
    }

    .email-box {
      padding: 24px;
      border: 1px solid #ddd;
      border-radius: 8px;
      min-height: 250px;
      line-height: 1.65;
      background: white;
      word-break: break-word;
    }

    .email-box p {
      margin-top: 0;
      margin-bottom: 16px;
    }

    .email-box a {
      color: #1155cc;
    }

    .copied {
      background: #eaf7ed !important;
    }

    @media (max-width: 720px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .container {
        margin-top: 20px;
      }

      .card {
        padding: 20px;
      }
    }
  </style>
</head>

<div class="container">

      </div>

      </div>

      <!-- Student Count -->
      <div class="field" id="studentCountField">
        <label id="studentCountLabel" for="studentCount">學生人數（選填）</label>

      <!-- Language -->
      <div class="field" id="languageField">
        <label for="language">Language</label>
        <select id="language">

  </div>

    <div class="subject-box" id="subjectOutput"></div>

</div>

-------------------------------- */

}


/* ------------------------------
   Dynamic Fields
-------------------------------- */

function updateFields() {

  const account = accountType.value;
  const type = emailType.value;

  // Reset visibility
  schoolField.classList.remove("hidden");
  usernameField.classList.remove("hidden");
  passwordField.classList.remove("hidden");

  startDateField.classList.remove("hidden");
  endDateField.classList.remove("hidden");
  studentCountField.classList.remove("hidden");

  languageField.classList.remove("hidden");
  platformField.classList.remove("hidden");

  distributorField.classList.add("hidden");

  schoolLabel.textContent = "School Name";

  // TEACHER
  if (account === "teacher") {

    schoolField.classList.add("hidden");

    startDateField.classList.add("hidden");
    endDateField.classList.add("hidden");
    studentCountField.classList.add("hidden");

    passwordField.classList.remove("hidden");

    return;
  }


  // ADMIN EXPIRY
  if (type === "expiry") {

    schoolLabel.textContent = "School / Recipient Name";

    usernameField.classList.add("hidden");
    passwordField.classList.add("hidden");

    startDateField.classList.add("hidden");
    studentCountField.classList.add("hidden");

    languageField.classList.add("hidden");
    platformField.classList.add("hidden");

    distributorField.classList.remove("hidden");

    endDateLabel.textContent = "到期日期";

    return;
  }


  // NEW
  if (type === "new") {

    passwordField.classList.remove("hidden");

    startDateLabel.textContent = "啟用日期（選填）";
    endDateLabel.textContent = "到期日期（選填）";
    studentCountLabel.textContent = "學生人數（選填）";
  }


  // RENEWAL
  if (type === "renewal") {

    passwordField.classList.add("hidden");

    startDateLabel.textContent = "啟用日期";
    endDateLabel.textContent = "到期日期";
    studentCountLabel.textContent = "學生人數";
  }


  // TRIAL
  if (type === "trial") {

    passwordField.classList.remove("hidden");

    startDateLabel.textContent = "試用啟用日期";
    endDateLabel.textContent = "試用到期日期";
    studentCountLabel.textContent = "試用學生人數";

    const studentCount = document.getElementById("studentCount");

    if (!studentCount.value) {
      studentCount.value = 30;
    }
  }
}


/* ------------------------------
   Helpers
-------------------------------- */

function escapeHTML(str) {

  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function parseDate(dateString) {

  if (!dateString) return null;

  const parts = dateString.split("-");

  return {
    year: Number(parts[0]),
    month: Number(parts[1]),
    day: Number(parts[2])
  };
}


function chineseDate(dateString) {

  const d = parseDate(dateString);

  if (!d) return "";

  return `${d.year}年${d.month}月${d.day}日`;
}


function englishOrdinal(day) {

  if (day >= 11 && day <= 13) {
    return day + "th";
  }

  switch (day % 10) {
    case 1: return day + "st";
    case 2: return day + "nd";
    case 3: return day + "rd";
    default: return day + "th";
  }
}


function englishDate(dateString) {

  const d = parseDate(dateString);

  if (!d) return "";

  const months = [
    "January",
    "February",
    "March",
    "April",
    "May",
    "June",
    "July",
    "August",
    "September",
    "October",
    "November",
    "December"
  ];

  return `${months[d.month - 1]} ${englishOrdinal(d.day)}, ${d.year}`;
}


function chineseShortDate(dateString) {

  const d = parseDate(dateString);

  if (!d) return "";

  return `${d.month}月${d.day}日`;
}


function zhLoginPlatformText() {

  return "";
}

}

/* ------------------------------
   Show Results
-------------------------------- */

function showResult(subject, body) {

  document.getElementById("subjectOutput").textContent =
    subject;

  document.getElementById("emailOutput").innerHTML =
    body;

  document
    .getElementById("resultSection")
    .classList.add("show");

  document
    .getElementById("resultSection")
    .scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
}


/* ------------------------------
   Copy Subject
-------------------------------- */

async function copySubject(button) {

  const subject =
    document.getElementById("subjectOutput").textContent;

  await navigator.clipboard.writeText(subject);

  showCopied(button);
}


/* ------------------------------
   Copy Rich Email
-------------------------------- */

async function copyEmail(button) {

  const emailElement =
    document.getElementById("emailOutput");

  const html = emailElement.innerHTML;
  const text = emailElement.innerText;

  try {

    const clipboardItem = new ClipboardItem({

      "text/html":
        new Blob(
          [html],
          { type: "text/html" }
        ),

      "text/plain":
        new Blob(
          [text],
          { type: "text/plain" }
        )

    });

    await navigator.clipboard.write([clipboardItem]);

  } catch (error) {

    await navigator.clipboard.writeText(text);
  }

  showCopied(button);
}


/* ------------------------------
   Copy Feedback
-------------------------------- */

function showCopied(button) {

  const original =
    button.textContent;

  button.textContent = "Copied!";
  button.classList.add("copied");

  setTimeout(() => {

    button.textContent = original;
    button.classList.remove("copied");

  }, 1500);
}
