<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sensay Email Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .page {
      max-width: 1050px;
      margin: 0 auto;
      padding: 40px 20px 70px;
    }

    .header {
      margin-bottom: 28px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 32px;
      color: #111827;
    }

    .header p {
      margin: 0;
      color: #6b7280;
      line-height: 1.6;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.07);
      margin-bottom: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-weight: 700;
      font-size: 14px;
      color: #374151;
    }

    input,
    select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      background: #ffffff;
      color: #111827;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .hidden {
      display: none !important;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 24px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: #111827;
      color: white;
    }

    .secondary {
      background: #eef2f7;
      color: #111827;
    }

    .result-card {
      display: none;
    }

    .result-card.show {
      display: block;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .result-header h2 {
      margin: 0;
      font-size: 22px;
    }

    .subject-box {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 20px;
    }

    .subject-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      color: #6b7280;
      margin-bottom: 6px;
    }

    #subjectOutput {
      font-weight: 700;
      word-break: break-word;
    }

    .email-preview {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 24px;
      background: white;
      line-height: 1.65;
      overflow-wrap: anywhere;
    }

    .email-preview p {
      margin-top: 0;
      margin-bottom: 16px;
    }

    .email-preview a {
      color: #1155cc;
    }

    .email-preview .signature {
      margin-top: 28px;
    }

    .email-preview .signature p {
      margin-bottom: 14px;
    }

    .signature-logo {
      display: block;
      width: 155px;
      max-width: 100%;
      height: auto;
      margin-top: 8px;
    }

    .copy-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .status {
      margin-top: 12px;
      color: #15803d;
      font-size: 14px;
      min-height: 20px;
    }

    .note {
      margin-top: 8px;
      color: #6b7280;
      font-size: 12px;
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .result-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .actions {
        justify-content: stretch;
      }

      .actions button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <div class="header">
      <h1>Sensay Email Generator</h1>
      <p>
        Enter the account information below to generate a ready-to-send Sensay email.
      </p>
    </div>

    <section class="card">
      <div class="grid">

        <div class="field">
          <label for="accountType">Account Type</label>
          <select id="accountType">
            <option value="admin">Admin</option>
            <option value="teacher">Teacher</option>
          </select>
        </div>

        <div class="field">
          <label for="emailType">Email Type</label>
          <select id="emailType"></select>
        </div>

        <div class="field" id="schoolField">
          <label for="schoolName" id="schoolLabel">School Name</label>
          <input
            id="schoolName"
            type="text"
            placeholder="Enter school name"
          />
        </div>

        <div class="field" id="usernameField">
          <label for="username">Username</label>
          <input
            id="username"
            type="email"
            placeholder="example@school.edu.tw"
            autocomplete="off"
          />
        </div>

        <div class="field" id="passwordField">
          <label for="password">Password</label>
          <input
            id="password"
            type="text"
            placeholder="Enter temporary password"
            autocomplete="off"
          />
        </div>

        <div class="field hidden" id="startDateField">
          <label for="startDate" id="startDateLabel">Start Date</label>
          <input id="startDate" type="date" />
        </div>

        <div class="field hidden" id="endDateField">
          <label for="endDate" id="endDateLabel">End Date</label>
          <input id="endDate" type="date" />
        </div>

        <div class="field hidden" id="studentCountField">
          <label for="studentCount" id="studentCountLabel">
            Number of Students
          </label>
          <input
            id="studentCount"
            type="number"
            min="1"
            placeholder="Enter number of students"
          />
        </div>

        <div class="field" id="languageField">
          <label for="language">Email Language</label>
          <select id="language">
            <option value="zh">Chinese</option>
            <option value="en">English</option>
          </select>
        </div>

        <div class="field" id="platformField">
          <label for="parentPlatform">
            Parent-Teacher-Student Platform
          </label>
          <select id="parentPlatform">
            <option value="no">No</option>
            <option value="yes">Yes</option>
          </select>
        </div>

        <div class="field hidden" id="distributorField">
          <label for="distributor">Distributor</label>
          <select id="distributor">
            <option value="no">No</option>
            <option value="yes">Yes</option>
          </select>
        </div>

        <div class="field">
          <label for="signature">Email Signature</label>
          <select id="signature">
            <option value="zh">Chinese</option>
            <option value="en">English</option>
            <option value="none">None</option>
          </select>
        </div>

      </div>

      <div class="actions">
        <button class="primary" id="generateBtn">
          Generate Email
        </button>
      </div>
    </section>

    <section class="card result-card" id="resultCard">

      <div class="result-header">
        <h2>Generated Email</h2>

        <div class="copy-actions">
          <button class="secondary" id="copySubjectBtn">
            Copy Subject
          </button>

          <button class="primary" id="copyEmailBtn">
            Copy Email
          </button>
        </div>
      </div>

      <div class="subject-box">
        <div class="subject-label">Subject</div>
        <div id="subjectOutput"></div>
      </div>

      <div class="email-preview" id="emailOutput"></div>

      <div class="status" id="copyStatus"></div>

      <div class="note">
        Copy Email preserves formatting and links when pasted into Gmail.
      </div>

    </section>

  </main>

    function escapeHTML(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function ordinal(n) {
      const s = ["th", "st", "nd", "rd"];
      const v = n % 100;
      return n + (s[(v - 20) % 10] || s[v] || s[0]);
    }

    function parseDate(dateString) {
      if (!dateString) return null;

      const parts = dateString.split("-");

      return new Date(
        Number(parts[0]),
        Number(parts[1]) - 1,
        Number(parts[2])
      );
    }

    function formatChineseDate(dateString) {
      const d = parseDate(dateString);

      if (!d) return "";

      return (
        d.getFullYear() +
        "年" +
        (d.getMonth() + 1) +
        "月" +
        d.getDate() +
        "日"
      );
    }

    function formatChineseShortDate(dateString) {
      const d = parseDate(dateString);

      if (!d) return "";

      return (d.getMonth() + 1) + "月" + d.getDate() + "日";
    }

    function formatEnglishDate(dateString, useOrdinal = true) {
      const d = parseDate(dateString);

      if (!d) return "";

      const months = [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December"
      ];

      const day = useOrdinal ? ordinal(d.getDate()) : d.getDate();

      return (
        months[d.getMonth()] +
        " " +
        day +
        ", " +
        d.getFullYear()
      );
    }

    function resetDynamicFields() {
      schoolField.classList.remove("hidden");
      usernameField.classList.remove("hidden");
      passwordField.classList.remove("hidden");
      languageField.classList.remove("hidden");
      platformField.classList.remove("hidden");

      startDateField.classList.add("hidden");
      endDateField.classList.add("hidden");
      studentCountField.classList.add("hidden");
      distributorField.classList.add("hidden");

      schoolLabel.textContent = "School Name";

      startDateLabel.textContent = "Start Date";
      endDateLabel.textContent = "End Date";
      studentCountLabel.textContent = "Number of Students";
    }

    function updateEmailTypeOptions() {
      const current = emailType.value;

      if (accountType.value === "teacher") {
        emailType.innerHTML =
          '<option value="new">New User</option>';
      } else {
        emailType.innerHTML = `
          <option value="new">New User</option>
          <option value="renewal">Renewal</option>
          <option value="trial">Trial</option>
          <option value="expiry">Expiry Reminder</option>
        `;

        const validValues = [
          "new",
          "renewal",
          "trial",
          "expiry"
        ];

        if (validValues.includes(current)) {
          emailType.value = current;
        }
      }

      updateFields();
    }

    function updateFields() {
      resetDynamicFields();

      const account = accountType.value;
      const type = emailType.value;

      if (account === "teacher") {
        schoolField.classList.add("hidden");

        startDateField.classList.add("hidden");
        endDateField.classList.add("hidden");
        studentCountField.classList.add("hidden");

        passwordField.classList.remove("hidden");
        platformField.classList.remove("hidden");

        return;
      }

      if (type === "new") {
        startDateField.classList.remove("hidden");
        endDateField.classList.remove("hidden");
        studentCountField.classList.remove("hidden");

        startDateLabel.textContent = "Start Date (Optional)";
        endDateLabel.textContent = "End Date (Optional)";
        studentCountLabel.textContent =
          "Number of Students (Optional)";

        passwordField.classList.remove("hidden");
      }

      if (type === "renewal") {
        passwordField.classList.add("hidden");

        startDateField.classList.remove("hidden");
        endDateField.classList.remove("hidden");
        studentCountField.classList.remove("hidden");

        startDateLabel.textContent = "Start Date";
        endDateLabel.textContent = "End Date";
        studentCountLabel.textContent = "Number of Students";
      }

      if (type === "trial") {
        startDateField.classList.remove("hidden");
        endDateField.classList.remove("hidden");
        studentCountField.classList.remove("hidden");

        startDateLabel.textContent = "Trial Start Date";
        endDateLabel.textContent = "Trial End Date";
        studentCountLabel.textContent =
          "Number of Trial Students";

        passwordField.classList.remove("hidden");

        if (!studentCount.value) {
          studentCount.value = 30;
        }
      }

      if (type === "expiry") {
        schoolLabel.textContent = "School / Recipient Name";

        usernameField.classList.add("hidden");
        passwordField.classList.add("hidden");
        startDateField.classList.add("hidden");
        studentCountField.classList.add("hidden");
        platformField.classList.add("hidden");

        endDateField.classList.remove("hidden");
        endDateLabel.textContent = "Expiry Date";

        distributorField.classList.remove("hidden");

        languageField.classList.remove("hidden");
      }
    }

    function chineseAdminSubscriptionBlock(type) {
      const start = startDate.value;
      const end = endDate.value;
      const students = studentCount.value;

      if (!start && !end && !students) {
        return "";
      }

      const title =
        type === "trial" ? "試用資訊" : "授權資訊";

      let lines = [];

      if (start) {
        lines.push(
          (type === "trial" ? "試用啟用日期：" : "啟用日期：") +
          formatChineseDate(start)
        );
      }

      if (end) {
        lines.push(
          (type === "trial" ? "試用到期日期：" : "到期日期：") +
          formatChineseDate(end)
        );
      }

      if (students) {
        lines.push(
          (type === "trial" ? "試用學生人數：" : "學生人數：") +
          escapeHTML(students)
        );
      }

      return `
        <p>
          <strong>${title}</strong><br>
          ${lines.join("<br>")}
        </p>
      `;
    }

    function englishAdminSubscriptionBlock(type) {
      const start = startDate.value;
      const end = endDate.value;
      const students = studentCount.value;

      if (!start && !end && !students) {
        return "";
      }

      const title =
        type === "trial"
          ? "Trial Subscription Details:"
          : "Subscription Details:";

      let lines = [];

      if (start) {
        lines.push(
          (type === "trial"
            ? "Trial Start Date: "
            : "Start Date: ") +
          formatEnglishDate(start)
        );
      }

      if (end) {
        lines.push(
          (type === "trial"
            ? "Trial End Date: "
            : "End Date: ") +
          formatEnglishDate(end)

    function validateForm() {
      const account = accountType.value;
      const type = emailType.value;

      if (account === "teacher") {
        if (!username.value.trim()) {
          alert("Please enter a username.");
          return false;
        }

        if (!password.value.trim()) {
          alert("Please enter a password.");
          return false;
        }

        return true;
      }

      if (!schoolName.value.trim()) {
        alert(
          type === "expiry"
            ? "Please enter a school or recipient name."
            : "Please enter a school name."
        );
        return false;
      }

      if (type === "expiry") {
        if (!endDate.value) {
          alert("Please select an expiry date.");
          return false;
        }

        return true;
      }

      if (!username.value.trim()) {
        alert("Please enter a username.");
        return false;
      }

      if (type === "new" || type === "trial") {
        if (!password.value.trim()) {
          alert("Please enter a password.");
          return false;
        }
      }

      if (type === "renewal") {
        if (
          !startDate.value ||
          !endDate.value ||
          !studentCount.value
        ) {
          alert(
            "Please enter the start date, end date, and number of students."
          );
          return false;
        }
      }

      if (type === "trial") {
        if (
          !startDate.value ||
          !endDate.value ||
          !studentCount.value
        ) {
          alert(
            "Please enter the trial start date, trial end date, and number of trial students."
          );
          return false;
        }
      }

      return true;
    }

    function generateEmail() {
      copyStatus.textContent = "";

      if (!validateForm()) {
        return;
      }

      const account = accountType.value;
      const type = emailType.value;
      const lang = language.value;

      let generated;

      if (type === "expiry") {
        generated =
          lang === "zh"
            ? generateChineseExpiry()
            : generateEnglishExpiry();
      } else if (account === "teacher") {
        generated =
          lang === "zh"
            ? generateChineseTeacher()
            : generateEnglishTeacher();
      } else {
        generated =
          lang === "zh"
            ? generateChineseAdmin(type)
            : generateEnglishAdmin(type);
      }

      subjectOutput.textContent = generated.subject;
      emailOutput.innerHTML = generated.body;

      resultCard.classList.add("show");

      resultCard.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }

    async function copySubject() {
      const subject = subjectOutput.textContent;

      if (!subject) return;

      try {
        await navigator.clipboard.writeText(subject);
        copyStatus.textContent = "Subject copied.";
      } catch (error) {
        fallbackCopyText(subject);
        copyStatus.textContent = "Subject copied.";
      }
    }

    function fallbackCopyText(text) {
      const textarea = document.createElement("textarea");

      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";

      document.body.appendChild(textarea);

      textarea.focus();
      textarea.select();

      document.execCommand("copy");

      document.body.removeChild(textarea);
    }

    async function copyEmail() {
      if (!emailOutput.innerHTML.trim()) {
        return;
      }

      const html = `
        <div style="
          font-family: Arial, Helvetica, sans-serif;
          font-size: 14px;
          line-height: 1.6;
          color: #222222;
        ">
          ${emailOutput.innerHTML}
        </div>
      `;

      const plainText = emailOutput.innerText;

      try {
        if (
          navigator.clipboard &&
          window.ClipboardItem
        ) {
          const htmlBlob = new Blob(
            [html],
            { type: "text/html" }
          );

          const textBlob = new Blob(
            [plainText],
            { type: "text/plain" }
          );

          const item = new ClipboardItem({
            "text/html": htmlBlob,
            "text/plain": textBlob
          });

          await navigator.clipboard.write([item]);

          copyStatus.textContent =
            "Email copied. You can now paste it into Gmail.";

          return;
        }
      } catch (error) {
        console.warn("Rich copy failed:", error);
      }

      fallbackRichCopy();
    }

    function fallbackRichCopy() {
      const range = document.createRange();

      range.selectNodeContents(emailOutput);

      const selection = window.getSelection();

      selection.removeAllRanges();
      selection.addRange(range);

      try {
        document.execCommand("copy");

        copyStatus.textContent =
          "Email copied. You can now paste it into Gmail.";
      } catch (error) {
        copyStatus.textContent =
          "Copy failed. Please select the email manually and copy it.";
      }

      selection.removeAllRanges();
    }
